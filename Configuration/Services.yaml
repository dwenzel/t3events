services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  DWenzel\T3events\:
    resource: '../Classes/*'

  DWenzel\T3events\Controller\Backend\ScheduleController:
    calls:
      - injectSession:
          - '@DWenzel\T3events\Session\Typo3BackendSession'
          -
  DWenzel\T3events\Controller\PerformanceController:
    calls:
      - injectSession:
          - '@DWenzel\T3events\Session\Typo3Session'

  DWenzel\T3events\Domain\Repository\TaskRepositoryInterface: '@DWenzel\T3events\Domain\Repository\TaskRepository'
  DWenzel\T3events\Resource\CoreResourceFactoryInterface: '@DWenzel\T3events\Resource\CoreResourceFactoryAdapter'
  DWenzel\T3events\Session\SessionInterface: '@DWenzel\T3events\Session\Typo3Session'

  DWenzel\T3events\Update\LegacyFileFieldsUpdateWizard:
    public: true
    tags:
      - name: upgradeWizard
        identifier: 't3eventsLegacyFileFieldUpdateWizard'

  DWenzel\T3events\Updates\SwitchableControllerActionsPluginUpdater:
    public: true
    tags:
      - name: upgradeWizard
        identifier: 't3eventsSwitchableControllerActionsPluginUpdater'