name: CI

on:
  push:
    branches: [main, 'support/**']
  pull_request:

permissions:
  contents: read

jobs:
  composer-validate:
    name: composer validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer validate --strict --no-check-lock

  php-lint:
    name: PHP lint ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP files
        run: find . -name '*.php' -not -path './.Build/*' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

  rector-fractor:
    name: Rector and Fractor (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Allow packages with security advisories
        run: composer config audit.block-insecure false
      - name: Install dependencies
        run: composer update --no-progress --prefer-dist
      - run: composer rector:check
      - run: composer fractor:check

  unit-tests:
    name: Unit tests TYPO3 12.4, PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      # The last public releases of TYPO3 12.4 have known security advisories.
      # They are installed for testing only.
      - name: Allow packages with security advisories
        run: composer config audit.block-insecure false
      # Fractor requires PHP 8.2; it is a development tool and not needed for the tests.
      - name: Remove Fractor on PHP 8.1
        if: matrix.php == '8.1'
        run: composer remove --dev --no-update a9f/typo3-fractor
      - name: Install dependencies
        run: composer update --no-progress --prefer-dist
      - run: composer test:unit
